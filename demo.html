<!doctype html><html lang="en" data-theme="light"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fortune Desk Demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;800&family=Manrope:wght@500;600;700;800&display=swap">
<style>
/* Layout: a casino-cabinet stage — the wheel with a pull lever bolted to its right, the team roster and recent hosts underneath. */
:root {
  --bg: #EAF0FC;
  --bg-glow: rgba(51, 105, 232, .20);
  --dot: rgba(19, 35, 92, .07);
  --surface: #FFFFFF;
  --ink: #0E1A3A;
  --muted: #5B6889;
  --line: rgba(19, 35, 92, .10);
  --brand: #3369E8;
  --brand-ink: #FFFFFF;
  --navy: #13235C;
  --gold: #EEB211;
  --chip-off: #F1F4FB;
  --shadow: 0 1px 2px rgba(19,35,92,.06), 0 12px 32px -12px rgba(19,35,92,.18);
  --scrim: rgba(10, 18, 44, .42);
  --font-display: "Unbounded", "Manrope", system-ui, sans-serif;
  --font-body: "Manrope", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #090F24; --bg-glow: rgba(51, 105, 232, .30); --dot: rgba(200, 215, 255, .06);
    --surface: #111A36; --ink: #E9EEFC; --muted: #93A0C6; --line: rgba(200, 215, 255, .10);
    --brand: #4A7CF0; --brand-ink: #FFFFFF; --navy: #0B1638; --gold: #F2BE2E; --chip-off: #0D1530;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 16px 40px -16px rgba(0,0,0,.6); --scrim: rgba(3, 6, 18, .62);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #090F24; --bg-glow: rgba(51, 105, 232, .30); --dot: rgba(200, 215, 255, .06);
  --surface: #111A36; --ink: #E9EEFC; --muted: #93A0C6; --line: rgba(200, 215, 255, .10);
  --brand: #4A7CF0; --brand-ink: #FFFFFF; --navy: #0B1638; --gold: #F2BE2E; --chip-off: #0D1530;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 16px 40px -16px rgba(0,0,0,.6); --scrim: rgba(3, 6, 18, .62);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { min-height: 100%; }
.content {
  background:
    radial-gradient(60% 45% at 45% 30%, var(--bg-glow), transparent 70%),
    radial-gradient(circle at 1px 1px, var(--dot) 1px, transparent 1.5px) 0 0 / 22px 22px,
    var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 15px;
  line-height: 1.5;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  -webkit-tap-highlight-color: transparent;
}
button, input { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--gold); outline-offset: 3px; border-radius: 10px; }

.app { max-width: 1000px; margin: 0 auto; padding-block: 24px 48px; display: grid; gap: 28px; }

.top { display: flex; align-items: center; justify-content: space-between; gap: 16px; }
.brand { display: flex; align-items: center; gap: 14px; min-width: 0; }
.logo { width: 56px; height: 56px; flex: none; filter: drop-shadow(0 6px 10px rgba(19,35,92,.22)); }
.eyebrow { margin: 0; font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
h1 { margin: 2px 0 0; font-family: var(--font-display); font-weight: 800; font-size: clamp(26px, 5vw, 38px); line-height: 1.05; letter-spacing: -.02em; text-wrap: balance; }
.icon-btn {
  width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface);
  display: grid; place-items: center; cursor: pointer; box-shadow: var(--shadow); flex: none;
}
.icon-btn svg { width: 20px; height: 20px; }
.icon-btn .off { display: none; }
.icon-btn[aria-pressed="true"] .on { display: none; }
.icon-btn[aria-pressed="true"] .off { display: block; }

.stage {
  display: grid; grid-template-columns: minmax(0, auto) clamp(64px, 15vw, 124px);
  justify-content: center; align-items: center; gap: clamp(4px, 2.5vw, 28px);
}
.wheel-col { display: grid; justify-items: center; gap: 12px; min-width: 0; }
.wheel-wrap { width: min(580px, 100%, 66vh); aspect-ratio: 1; max-width: 100%; }
#wheel { width: 100%; height: 100%; display: block; }
.now { margin: 0; display: flex; align-items: baseline; gap: 10px; min-height: 30px; }
.now-label { font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
#current { font-family: var(--font-display); font-weight: 600; font-size: 20px; }

.lever-col { position: relative; display: grid; justify-items: center; align-self: center; }
#lever { width: 100%; height: auto; display: block; cursor: grab; touch-action: none; user-select: none; overflow: visible; }
#lever.held { cursor: grabbing; }
#lever.disabled { opacity: .45; cursor: not-allowed; }
.hint {
  position: absolute; top: -6px; left: 50%; translate: -50% -100%; margin: 0; white-space: nowrap;
  font-size: 12px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--brand);
  display: flex; flex-direction: column; align-items: center; gap: 2px; transition: opacity .4s;
}
.hint svg { width: 14px; height: 14px; animation: bob 1.4s ease-in-out infinite; }
.hint.gone { opacity: 0; }
@keyframes bob { 50% { transform: translateY(4px); } }

.panel { display: grid; grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr); gap: 16px; align-items: start; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 22px; padding: 20px; box-shadow: var(--shadow); display: grid; gap: 14px; min-width: 0; }
.card-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
h2 { margin: 0; font-size: 16px; font-weight: 800; }
.count { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip {
  display: inline-flex; align-items: center; border-radius: 999px; background: var(--brand); color: var(--brand-ink);
  font-weight: 700; font-size: 14px; overflow: hidden; transition: background .2s, color .2s, transform .2s;
}
.chip button { border: 0; background: none; cursor: pointer; padding: 7px 4px 7px 14px; }
.chip .del { padding: 7px 11px 7px 6px; opacity: .65; }
.chip .del:hover { opacity: 1; }
.chip.off { background: var(--chip-off); color: var(--muted); box-shadow: inset 0 0 0 1px var(--line); }
.chip.off .name { text-decoration: line-through; }
.chips.locked { pointer-events: none; opacity: .6; }
.add { display: flex; gap: 8px; }
.add input {
  flex: 1; min-width: 0; padding: 10px 14px; border-radius: 12px; border: 1px solid var(--line); background: var(--chip-off);
}
.btn {
  border: 0; border-radius: 12px; padding: 10px 16px; font-weight: 800; cursor: pointer;
  background: var(--chip-off); color: var(--ink); box-shadow: inset 0 0 0 1px var(--line);
}
.btn.primary { background: var(--brand); color: var(--brand-ink); box-shadow: none; }
.link { justify-self: start; border: 0; background: none; padding: 0; color: var(--brand); font-weight: 700; cursor: pointer; }
#history { margin: 0; padding: 0; list-style: none; display: grid; gap: 2px; }
#history li { display: flex; justify-content: space-between; gap: 12px; padding: 8px 0; border-bottom: 1px solid var(--line); }
#history li:last-child { border-bottom: 0; }
#history .when { color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; white-space: nowrap; }
#history li { align-items: center; }
#history .who { font-weight: 700; min-width: 0; overflow-wrap: anywhere; }
.hist-right { display: flex; align-items: center; gap: 6px; }
.hist-del {
  width: 28px; height: 28px; border: 0; border-radius: 50%; background: none; color: var(--muted);
  font-size: 18px; line-height: 1; cursor: pointer; opacity: .55; transition: opacity .2s, background .2s;
}
.hist-del:hover, .hist-del:focus-visible { opacity: 1; background: var(--chip-off); }
.empty { color: var(--muted); margin: 0; }

.win { position: absolute; inset: 0; z-index: 20; display: grid; place-items: center; padding: 24px max(16px, env(safe-area-inset-right, 0px)) 24px max(16px, env(safe-area-inset-left, 0px)); background: var(--scrim); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }
.win-card {
  position: relative; width: min(440px, 100%); background: var(--surface); border-radius: 28px; padding: 36px 28px 26px;
  display: grid; justify-items: center; gap: 10px; text-align: center; box-shadow: 0 30px 80px -20px rgba(0,0,0,.45);
  border: 1px solid var(--line); will-change: transform;
}
.win-card img { width: 88px; height: 88px; margin-bottom: 2px; filter: drop-shadow(0 8px 12px rgba(19,35,92,.22)); }
.win-name { margin: 0 0 12px; font-family: var(--font-display); font-weight: 800; font-size: clamp(30px, 8vw, 46px); line-height: 1.05; letter-spacing: -.02em; overflow-wrap: anywhere; color: var(--brand); }
.win-actions { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
.x { position: absolute; top: 10px; right: 12px; width: 40px; height: 40px; border: 0; background: none; font-size: 26px; line-height: 1; color: var(--muted); cursor: pointer; border-radius: 50%; }
#confetti { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 30; }

@media (max-width: 720px) {
  .panel { grid-template-columns: minmax(0, 1fr); }
  .app { gap: 20px; padding-block: 16px 36px; }
  .logo { width: 46px; height: 46px; }
}
@media (prefers-reduced-motion: reduce) {
  .hint svg { animation: none; }
}

/* ---------- macOS window mock (prototype only) ---------- */
[hidden] { display: none !important; }
:root { --chrome: #F3F5FA; --chrome-ink: #3A4466; }
/* Dark theme in neutral blacks; the wheel, the lever and the brand blue keep their colours. */
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0C0C0E; --bg-glow: rgba(255, 255, 255, .05); --dot: rgba(255, 255, 255, .055);
    --surface: #18181B; --ink: #F2F2F4; --muted: #9B9BA3; --line: rgba(255, 255, 255, .09);
    --chip-off: #232327; --shadow: 0 1px 2px rgba(0,0,0,.4), 0 16px 40px -16px rgba(0,0,0,.7); --scrim: rgba(0, 0, 0, .62);
    --chrome: #1C1C1F; --chrome-ink: #D6D6DB;
  }
}
:root[data-theme="dark"] {
  --bg: #0C0C0E; --bg-glow: rgba(255, 255, 255, .05); --dot: rgba(255, 255, 255, .055);
  --surface: #18181B; --ink: #F2F2F4; --muted: #9B9BA3; --line: rgba(255, 255, 255, .09);
  --chip-off: #232327; --shadow: 0 1px 2px rgba(0,0,0,.4), 0 16px 40px -16px rgba(0,0,0,.7); --scrim: rgba(0, 0, 0, .62);
  --chrome: #1C1C1F; --chrome-ink: #D6D6DB;
}
body {
  margin: 0; min-height: 100vh; color: var(--ink); font-family: var(--font-body);
  background: #1B2A6B linear-gradient(155deg, #13235C 0%, #3D55B8 45%, #7C6BD6 75%, #E89A7A 100%) fixed;
}
.desk { min-height: 100vh; display: grid; grid-template-rows: auto 1fr; }
.menubar {
  height: 26px; display: flex; align-items: center; gap: 20px; padding: 0 16px; color: #fff;
  font: 500 13px -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif;
  background: rgba(10, 16, 40, .28); -webkit-backdrop-filter: blur(24px); backdrop-filter: blur(24px);
}
.menubar .apple { font-size: 15px; }
.menubar b { font-weight: 700; }
.menubar .clock { margin-left: auto; font-variant-numeric: tabular-nums; }
.screen { display: grid; place-items: center; padding: 10px 12px 12px; min-width: 0; }
.mac-window {
  width: 100%; height: calc(100vh - 48px); min-height: 600px;
  display: flex; flex-direction: column; border-radius: 12px; overflow: hidden; background: var(--bg);
  box-shadow: 0 0 0 .5px rgba(0,0,0,.45), inset 0 0 0 .5px rgba(255,255,255,.12), 0 30px 90px -10px rgba(0,0,0,.55);
}
.titlebar {
  position: relative; flex: none; height: 38px; display: flex; align-items: center; padding: 0 14px;
  background: var(--chrome); border-bottom: 1px solid var(--line); user-select: none;
}
.lights { display: flex; gap: 8px; }
.lights i { width: 12px; height: 12px; border-radius: 50%; box-shadow: inset 0 0 0 .5px rgba(0,0,0,.22); }
.lights i:nth-child(1) { background: #FF5F57; } .lights i:nth-child(2) { background: #FEBC2E; } .lights i:nth-child(3) { background: #28C840; }
.wtitle {
  position: absolute; left: 50%; translate: -50% 0; max-width: 60%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  font: 600 13px -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif; color: var(--chrome-ink);
}
.stagewrap { position: relative; flex: 1; min-height: 0; }
.content {
  position: absolute; inset: 0; overflow: auto; container-type: size;
  padding-left: 16px; padding-right: 16px; color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.5;
}
.proto {
  position: fixed; top: 2px; right: 190px; z-index: 50; display: flex; align-items: center; gap: 4px; height: 22px;
  color: #fff; white-space: nowrap; font: 600 12px -apple-system, BlinkMacSystemFont, sans-serif;
}
.proto span { opacity: .7; margin-right: 4px; }
.proto button { border: 0; border-radius: 6px; padding: 3px 9px; background: rgba(255,255,255,.14); color: #fff; font: inherit; cursor: pointer; }
.proto button:hover { background: rgba(255,255,255,.26); }

/* ---------- Universal: team name, onboarding ---------- */
.brand { flex: 1; }
.brand > div { flex: 1; min-width: 0; }
.team {
  display: block; width: 100%; min-width: 0; margin: 0; padding: 0 4px; margin-left: -4px; border: 0; border-radius: 10px;
  background: none; color: inherit; font: inherit; letter-spacing: inherit; line-height: inherit; outline: none;
  text-overflow: ellipsis;
}
.team::placeholder { color: var(--muted); opacity: .5; }
.team:hover { background: var(--chip-off); }
.team:focus { background: var(--chip-off); box-shadow: inset 0 0 0 2px var(--brand); }
.coach {
  margin: 8px 0 0; display: flex; align-items: center; gap: 8px; width: fit-content; max-width: 100%;
  padding: 6px 12px 6px 6px; border-radius: 999px; font-size: 13px; font-weight: 700; line-height: 1.3;
  color: var(--ink); background: var(--surface); box-shadow: inset 0 0 0 1px var(--line), var(--shadow);
}
.coach b {
  flex: none; display: grid; place-items: center; width: 22px; height: 22px; border-radius: 50%;
  background: var(--gold); color: #13235C; font-size: 12px; font-weight: 800;
}
.card .coach { margin: 0; }
@keyframes nudge { 0%, 100% { box-shadow: 0 0 0 0 rgba(238,178,17,0); } 50% { box-shadow: 0 0 0 6px rgba(238,178,17,.38); } }
.app[data-step="1"] .team { animation: nudge 1.8s ease-in-out infinite; }
.app[data-step="2"] .add input { animation: nudge 1.8s ease-in-out infinite; }
.empty-roster { color: var(--muted); margin: 0; font-size: 14px; }
/* One screen, no page scroll: title on top, wheel + lever on the left, people and history on the right.
   Only the history scrolls inside its card. */
.content { overflow: hidden; }
.app {
  height: 100%; max-width: 1600px; padding-block: 14px 16px;
  grid-template-columns: minmax(0, 1fr) clamp(280px, 26cqw, 360px); grid-template-rows: auto minmax(0, 1fr); gap: 6px 28px;
}
.top { grid-column: 1 / -1; }
.stage { grid-column: 1; grid-row: 2; min-height: 0; align-self: center; }
.panel { grid-column: 2; grid-row: 2; min-height: 0; display: flex; flex-direction: column; align-items: stretch; gap: 14px; }
.top h1 { font-family: var(--font-display); font-size: clamp(30px, 3.6cqw, 58px); }
.logo { width: clamp(46px, 5cqw, 72px); height: auto; }
.panel .card { gap: 12px; padding: 18px; }
.panel .card:first-child { flex: none; max-height: 58%; display: flex; flex-direction: column; }
.panel .card:first-child .chips { overflow: auto; min-height: 0; flex: 0 1 auto; padding: 2px; margin: -2px; }
.panel .card:last-child { flex: 1 1 auto; min-height: 120px; display: flex; flex-direction: column; }
#history { flex: 1; min-height: 0; overflow: auto; align-content: start; margin-right: -8px; padding-right: 8px; }
.add .btn { padding-inline: 14px; }
/* The wheel takes the height left under the title and the width left of the side column. */
.wheel-wrap { width: clamp(260px, min(100cqh - 178px, 100cqw - 32px - clamp(280px, 26cqw, 360px) - 28px - clamp(64px, 15vw, 124px) - 40px), 900px); }
@supports not (width: 1cqh) { .wheel-wrap { width: clamp(260px, min(100vh - 300px, 50vw), 900px); } }
@media (max-width: 860px) {
  .content { overflow: auto; }
  .app { height: auto; grid-template-columns: minmax(0, 1fr); grid-template-rows: none; }
  .top, .stage, .panel { grid-column: 1; grid-row: auto; }
  .panel .card:first-child, .panel .card:last-child { max-height: none; }
  .wheel-wrap { width: min(560px, 100%); }
}
.team::placeholder { opacity: .38; }

@media (max-width: 720px) {
  .screen { padding: 0; place-items: stretch; }
  .mac-window { width: 100%; height: calc(100vh - 26px); min-height: 0; border-radius: 0; }
  .proto { right: 8px; }
  .proto span { display: none; }
}
@media (prefers-reduced-motion: reduce) {
  .app[data-step] .team, .app[data-step] .add input { animation: none; }
}

/* ---------- Team switcher ---------- */
.brand > div { position: relative; }
.title-row { display: flex; align-items: center; gap: 4px; min-width: 0; }
.title-wrap { display: inline-grid; min-width: 0; max-width: 100%; }
.title-wrap::after {
  content: attr(data-value) " "; grid-area: 1 / 1; visibility: hidden; white-space: pre; overflow: hidden;
  font: inherit; letter-spacing: inherit; padding: 0 4px;
}
.title-wrap .team { grid-area: 1 / 1; width: 100%; }
.teams-btn {
  flex: none; width: 38px; height: 38px; border: 0; border-radius: 10px; background: none; color: var(--muted);
  display: grid; place-items: center; cursor: pointer; transition: background .15s, color .15s;
}
.teams-btn svg { width: 22px; height: 22px; transition: rotate .2s; }
.teams-btn:hover, .teams-btn[aria-expanded="true"] { background: var(--chip-off); color: var(--ink); }
.teams-btn[aria-expanded="true"] svg { rotate: 180deg; }
.teams-menu {
  position: absolute; top: calc(100% + 6px); left: -6px; z-index: 15; width: min(340px, 80vw);
  padding: 6px; border-radius: 14px; background: var(--surface); border: 1px solid var(--line);
  box-shadow: 0 24px 60px -16px rgba(0,0,0,.45); display: grid; gap: 2px; font-size: 14px;
}
.tm-item {
  display: grid; grid-template-columns: 18px minmax(0, 1fr) auto; align-items: center; gap: 8px; width: 100%;
  padding: 8px 10px; border: 0; border-radius: 8px; background: none; color: var(--ink); text-align: left; cursor: pointer; font-weight: 700;
}
.tm-item:hover, .tm-item:focus-visible { background: var(--brand); color: #fff; outline: none; }
.tm-check { color: var(--brand); visibility: hidden; }
.tm-item.on .tm-check { visibility: visible; }
.tm-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tm-name.untitled { color: var(--muted); font-style: italic; }
.tm-count { color: var(--muted); font-size: 13px; font-weight: 600; }
.tm-item:is(:hover, :focus-visible) :is(.tm-check, .tm-count, .tm-name.untitled) { color: #fff; }
.tm-sep { height: 1px; margin: 4px 8px; background: var(--line); }
.tm-item.danger { color: #E5484D; }
.tm-item.danger:hover, .tm-item.danger:focus-visible { background: #E5484D; color: #fff; }

/* Dark theme: a light rim and a soft glow keep the navy lever off the black background. */
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) #lever .plate { stroke: rgba(255, 255, 255, .22); stroke-width: 1.2; }
  :root:not([data-theme="light"]) #lever { filter: drop-shadow(0 0 18px rgba(74, 124, 240, .28)); }
  :root:not([data-theme="light"]) #rod-shadow { stroke: #000; stroke-opacity: .5; }
}
:root[data-theme="dark"] #lever .plate { stroke: rgba(255, 255, 255, .22); stroke-width: 1.2; }
:root[data-theme="dark"] #lever { filter: drop-shadow(0 0 18px rgba(74, 124, 240, .28)); }
:root[data-theme="dark"] #rod-shadow { stroke: #000; stroke-opacity: .5; }

/* ---------- Demo frame ---------- */
html, body { height: 100%; overflow: hidden; }
body { background: transparent; min-height: 0; }
.desk { min-height: 0; height: 100%; display: block; }
.menubar { display: none; }
.screen { padding: 0; height: 100%; }
.mac-window { height: 100%; min-height: 0; border-radius: 12px; }
* { cursor: default !important; -webkit-user-select: none; user-select: none; caret-color: transparent; }
.teams-btn { pointer-events: none; }
.demo-tag {
  position: absolute; right: 14px; padding: 2px 9px; border-radius: 999px; background: var(--gold); color: #13235C;
  font: 800 11px var(--font-body); letter-spacing: .08em; text-transform: uppercase;
}
.team.demo-focus { background: var(--chip-off); box-shadow: inset 0 0 0 2px var(--brand); }
.add input.demo-focus { box-shadow: inset 0 0 0 2px var(--brand); background: var(--surface); }
.demo-cursor {
  position: fixed; left: 0; top: 0; z-index: 100; width: 26px; height: 26px; margin: -3px 0 0 -5px; pointer-events: none;
  filter: drop-shadow(0 2px 3px rgba(0,0,0,.3)); transition: scale .12s, opacity .3s;
  transform-origin: 5px 3px; will-change: transform;
}

<script>
(() => {
  const TAU = Math.PI * 2;
  const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const $ = (s) => document.querySelector(s);

  // Demo: nothing is read or saved, every visit starts from scratch.
  const store = { get(k, d) { return d; }, set() {} };

  let teams = store.get("wheel.teams", null);
  if (!Array.isArray(teams) || !teams.length) { teams = [{ id: "t" + Date.now().toString(36) }]; store.set("wheel.teams", teams); }
  let teamId = store.get("wheel.current", teams[0].id);
  if (!teams.some((t) => t.id === teamId)) teamId = teams[0].id;
  const K = (k, id = teamId) => `wheel.t.${id}.${k}`;
  let people = store.get(K("people"), null);
  if (!Array.isArray(people)) people = [];
  let teamName = store.get(K("team"), "");
  let picture = store.get(K("picture"), null);
  let onboarded = !!store.get("wheel.onboarded", false);
  let history = store.get(K("history"), []);
  if (!Array.isArray(history)) history = [];
  let names = people.filter((p) => p.on).map((p) => p.name);

  // ---------- Sound ----------
  let ac = null;
  let muted = true;
  const muteBtn = $("#mute");
  function syncMute() {
    muteBtn.setAttribute("aria-pressed", String(muted));
    muteBtn.setAttribute("aria-label", "Sound");
  }
  syncMute();
  muteBtn.addEventListener("click", () => { muted = !muted; store.set("wheel.muted", muted); syncMute(); audio(); });
  function audio() {
    if (!ac) { try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return null; } }
    if (ac.state === "suspended") ac.resume();
    return ac;
  }
  let lastTick = 0;
  function tickSound(vol) {
    if (muted || !ac) return;
    const t = ac.currentTime;
    if (t - lastTick < 0.022) return;
    lastTick = t;
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = "triangle";
    o.frequency.setValueAtTime(2200 + Math.random() * 300, t);
    o.frequency.exponentialRampToValueAtTime(700, t + 0.03);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.18 * vol + 0.02, t + 0.002);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.05);
    o.connect(g).connect(ac.destination);
    o.start(t); o.stop(t + 0.06);
  }
  function clunkSound() {
    if (muted || !ac) return;
    const t = ac.currentTime;
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = "sine";
    o.frequency.setValueAtTime(170, t);
    o.frequency.exponentialRampToValueAtTime(55, t + 0.18);
    g.gain.setValueAtTime(0.5, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.25);
    o.connect(g).connect(ac.destination);
    o.start(t); o.stop(t + 0.26);
    const len = Math.floor(ac.sampleRate * 0.08);
    const buf = ac.createBuffer(1, len, ac.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 3);
    const n = ac.createBufferSource(), f = ac.createBiquadFilter(), ng = ac.createGain();
    n.buffer = buf; f.type = "bandpass"; f.frequency.value = 1400; ng.gain.value = 0.35;
    n.connect(f).connect(ng).connect(ac.destination);
    n.start(t);
  }
  function winSound() {
    if (muted || !ac) return;
    const t = ac.currentTime;
    [523.25, 659.25, 783.99, 1046.5, 1318.5].forEach((fq, i) => {
      const o = ac.createOscillator(), g = ac.createGain();

  const COL = { blue: "#3369E8", white: "#FFFFFF", third: "#CFDCFB", textOnBlue: "#FFFFFF", textOnWhite: "#1D4CC2", gold: "#EEB211", navy: "#13235C" };
  let size = 0, dpr = 1, face = null;
  const G = {}; // geometry in CSS px

  function segColor(i, n) {
    if (n % 2 === 1 && i === n - 1 && n > 1) return COL.third;
    return i % 2 === 0 ? COL.blue : COL.white;
  }

  function resize() {
    const r = cv.getBoundingClientRect();
    if (!r.width) return;
    dpr = Math.min(2.5, window.devicePixelRatio || 1);
    size = r.width;
    cv.width = Math.round(size * dpr);
    cv.height = Math.round(size * dpr);
    const c = size / 2;
    Object.assign(G, {
      c,
      rRim: c * 0.94,
      rFace: c * 0.82,
      rPeg: c * 0.785,
      pegSize: c * 0.02,
      rHub: c * 0.235,
      pivotY: c * 0.035,
      flapW: c * 0.062,
    });
    G.flapLen = (c - c * 0.735) - G.pivotY;
    buildFace();
  }
  new ResizeObserver(resize).observe(cv);

  function fitText(c2, text, maxW, fs) {
    let size = fs;
    c2.font = `700 ${size}px Manrope, system-ui, sans-serif`;
    while (c2.measureText(text).width > maxW && size > fs * 0.62) {
      size -= 0.5;
      c2.font = `700 ${size}px Manrope, system-ui, sans-serif`;
    }
    if (c2.measureText(text).width <= maxW) return text;
    let t = text;
    while (t.length > 1 && c2.measureText(t + "…").width > maxW) t = t.slice(0, -1);
    return t + "…";
  }

  const hex = (h) => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
  const rgbStr = (a) => `rgb(${Math.round(a[0])},${Math.round(a[1])},${Math.round(a[2])})`;

  // Paints the face at the origin; each item takes a share of the circle proportional to its weight w.
  function paintFace(f, items) {
    const { c, rFace, rPeg, pegSize, rHub } = G;
    const tot = items.reduce((a, v) => a + v.w, 0);
    if (tot < 1e-4) { f.beginPath(); f.arc(0, 0, rFace, 0, TAU); f.fillStyle = "#DDE5F8"; f.fill(); return; }
    let acc = -Math.PI / 2;
    const spans = items.map((v) => { const s = TAU * v.w / tot, a0 = acc; acc += s; return { v, a0, s }; });
    const shown = spans.filter((x) => x.s > 1e-3);
    for (const { v, a0, s } of shown) {
      f.beginPath(); f.moveTo(0, 0); f.arc(0, 0, rFace, a0, a0 + s); f.closePath();
      f.fillStyle = rgbStr(v.rgb); f.fill();
    }
    const multi = shown.length > 1;
    if (multi) {
      // soft seams
      f.strokeStyle = "rgba(19,35,92,.10)"; f.lineWidth = 1;
      for (const { a0 } of shown) { f.beginPath(); f.moveTo(0, 0); f.lineTo(Math.cos(a0) * rFace, Math.sin(a0) * rFace); f.stroke(); }
    }
    // names
    const outer = rFace * 0.9, inner = rHub * 1.3, maxW = outer - inner;
    f.textAlign = "right"; f.textBaseline = "middle";
    for (const { v, a0, s } of shown) {
      const fs = Math.min(c * 0.078, s * rFace * 0.5 * 0.62 * 1.6);
      if (fs < 4) continue;
      f.save();
      f.globalAlpha = Math.min(1, Math.max(0, (v.w - 0.25) / 0.75));
      f.rotate(a0 + s / 2);
      const label = fitText(f, v.name, maxW, fs);
      f.fillStyle = rgbStr(v.trgb);
      f.fillText(label, outer, 1);
      f.restore();
    }
    // pegs at every boundary
    if (multi) {
      for (const { a0 } of shown) {
        const x = Math.cos(a0) * rPeg, y = Math.sin(a0) * rPeg;
        f.beginPath(); f.arc(x, y + pegSize * 0.25, pegSize, 0, TAU); f.fillStyle = "rgba(10,20,64,.35)"; f.fill();
        const g = f.createRadialGradient(x - pegSize * 0.4, y - pegSize * 0.4, 0, x, y, pegSize);
        g.addColorStop(0, "#FFF6D2"); g.addColorStop(0.5, "#F2BE2E"); g.addColorStop(1, "#B58200");
        f.beginPath(); f.arc(x, y, pegSize, 0, TAU); f.fillStyle = g; f.fill();
      }
    }
  }

  function targetItems() {
    const n = names.length;
    return names.map((name, i) => {
      const seg = segColor(i, n);
      return { name, rgb: hex(seg), trgb: hex(seg === COL.blue ? COL.textOnBlue : COL.textOnWhite) };
    });
  }

  // Static face for the settled wheel, drawn once per change.
  function buildFace() {
    if (!size) return;
    face = document.createElement("canvas");
    face.width = cv.width; face.height = cv.height;
    const f = face.getContext("2d");
    f.setTransform(dpr, 0, 0, dpr, 0, 0);
    f.translate(G.c, G.c);
    paintFace(f, targetItems().map((t) => ({ ...t, w: 1 })));
  }

  // Animated face while sectors change: every name has a weight that eases to 1 (in the wheel) or 0 (out).
  let vis = null, faceAnim = false;
  function syncVis(instant) {
    const tgt = targetItems();
    if (instant || !vis || reduceMotion || !tgt.length) {
      vis = tgt.map((t) => ({ name: t.name, w: 1, tw: 1, rgb: t.rgb.slice(), rgbT: t.rgb, trgb: t.trgb.slice(), trgbT: t.trgb }));
      faceAnim = false;
      return;
    }
    const next = tgt.map((t) => {
      const v = vis.find((o) => o.name === t.name) || { name: t.name, w: 0, rgb: t.rgb.slice(), trgb: t.trgb.slice() };
      v.tw = 1; v.rgbT = t.rgb; v.trgbT = t.trgb;
      return v;
    });
    // names that left keep their place while they shrink
    vis.forEach((v, i) => {
      if (next.includes(v)) return;
      v.tw = 0;
      let j = i - 1;
      while (j >= 0 && !next.includes(vis[j])) j--;
      next.splice(j < 0 ? 0 : next.indexOf(vis[j]) + 1, 0, v);
    });
    vis = next;
    faceAnim = true;
  }
  function stepVis(dt) {
    if (!faceAnim) return;
    const k = 1 - Math.exp(-dt * 9);
    let done = true;
    for (const v of vis) {
      v.w += (v.tw - v.w) * k;
      for (let j = 0; j < 3; j++) { v.rgb[j] += (v.rgbT[j] - v.rgb[j]) * k; v.trgb[j] += (v.trgbT[j] - v.trgb[j]) * k; }
      if (Math.abs(v.tw - v.w) > 0.004) done = false;
    }
    if (done) {
      vis = vis.filter((v) => v.tw > 0);
      vis.forEach((v) => { v.w = 1; v.rgb = v.rgbT.slice(); v.trgb = v.trgbT.slice(); });
      faceAnim = false;
    }
  }

  function paintHubFace(g, x, y, r) {
    if (picture && hubReady) {
      g.fillStyle = "#FFFFFF"; g.fillRect(x - r, y - r, r * 2, r * 2);
      const k = Math.max((r * 2) / hubImg.naturalWidth, (r * 2) / hubImg.naturalHeight);
      const w = hubImg.naturalWidth * k, h = hubImg.naturalHeight * k;
      g.drawImage(hubImg, x - w / 2, y - h / 2, w, h);
    } else if (cupReady) g.drawImage(cup, x - r, y - r, r * 2, r * 2);
    else { g.fillStyle = "#F4EFE4"; g.fillRect(x - r, y - r, r * 2, r * 2); }
  }
  function badge(px) {
    const k = 2, cnv = document.createElement("canvas");
    cnv.width = cnv.height = px * k;
    const g = cnv.getContext("2d");
    g.scale(k, k);
    const r = px / 2;
    g.beginPath(); g.arc(r, r, r - 1, 0, TAU); g.clip();
    paintHubFace(g, r, r, r - 1);
    g.beginPath(); g.arc(r, r, r - 1.5, 0, TAU); g.lineWidth = 2; g.strokeStyle = "rgba(19,35,92,.10)"; g.stroke();
    return cnv.toDataURL("image/png");
  }
  const logoEl = $("#logo"), winImgEl = $("#win-img");
  const cupLogo = logoEl.src, cupWin = winImgEl.src;
  function refreshBadges() {
    const own = picture && hubReady;
    logoEl.src = own ? badge(56) : cupLogo;
    winImgEl.src = own ? badge(88) : cupWin;
  }

  // The cup stays upright while the wheel turns under it.
  function drawHub() {
    const { c, rHub } = G;
    ctx.save();
    ctx.shadowColor = "rgba(10,20,64,.4)"; ctx.shadowBlur = c * 0.06; ctx.shadowOffsetY = c * 0.015;
    ctx.beginPath(); ctx.arc(c, c, rHub, 0, TAU); ctx.fillStyle = "#FFFFFF"; ctx.fill();
    ctx.restore();
    const ri = rHub * 0.9;
    ctx.save();
    ctx.beginPath(); ctx.arc(c, c, ri, 0, TAU); ctx.clip();
    paintHubFace(ctx, c, c, ri);
    const ish = ctx.createRadialGradient(c, c, ri * 0.8, c, c, ri);
    ish.addColorStop(0, "rgba(10,20,64,0)"); ish.addColorStop(1, "rgba(10,20,64,.16)");
    ctx.fillStyle = ish; ctx.fillRect(c - ri, c - ri, ri * 2, ri * 2);
    ctx.restore();
  }

  // ---------- Physics ----------
  const KF = 2200, CF = 2 * 0.16 * Math.sqrt(2200); // flapper spring, underdamped
  const PR = 0.042;      // peg + flapper-tip clearance, in rim units
  const REACH = 0.062;   // a peg further than this slips under the flapper
  const XMAX = REACH + PR;
  const KC = 42;         // how hard a bent flapper pushes the wheel back
  const FA = 0.26, FB = 0.3; // dry + viscous friction of the wheel
  const KL = 210, CL = 2 * 0.17 * Math.sqrt(210); // lever return spring

  const S = {
    theta: Math.random() * TAU, omega: 0, spinning: false,
    tipX: 0, tipV: 0, contact: false, side: 1, lastPeg: null,
    stillT: 0, slowT: 0, spinT: 0, celebrateT: 0,
  };
  const L = { x: 0, v: 0, held: false, target: 0, armed: true, auto: false, autoT: 0, peakV: 0 };

  function currentIndex() {
    const n = names.length;
    if (!n) return -1;
    const s = TAU / n;
    const a = ((-S.theta % TAU) + TAU) % TAU;
    return Math.min(n - 1, Math.floor(a / s));
  }

  function step(h) {
    // lever
    if (L.auto) {
      L.autoT += h;
      const p = Math.min(1, L.autoT / 0.36);
      L.target = p < 0.5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2;
      if (p >= 1) { L.auto = false; release(); }
    }
    if (L.held) {
      const prev = L.x;
      L.x += (L.target - L.x) * Math.min(1, h * 38);
      L.v = (L.x - prev) / h;
      L.peakV = Math.max(L.peakV * 0.995, L.v);
      if (L.x > 0.94 && L.armed) fire();
    } else {

  function syncTitleWidth() { wrapEl.dataset.value = teamEl.value || teamEl.placeholder; }
  function plural(n) {
    const a = n % 10, b = n % 100;
    return `${n} ${a === 1 && b !== 11 ? "человек" : a >= 2 && a <= 4 && (b < 12 || b > 14) ? "человека" : "человек"}`;
  }
  function loadTeam(id) {
    teamId = id; store.set("wheel.current", id);
    teamName = store.get(K("team"), "");
    people = store.get(K("people"), []); if (!Array.isArray(people)) people = [];
    history = store.get(K("history"), []); if (!Array.isArray(history)) history = [];
    picture = store.get(K("picture"), null);
    hubReady = false; if (picture) hubImg.src = picture;
    teamEl.value = teamName; syncTitleWidth(); syncTitle(); refreshBadges();
    S.theta = Math.random() * TAU;
    vis = null;
    saveRoster(); renderHistory();
  }
  let deleteArmed = false;
  function menuButton(cls, html, onClick) {
    const b = document.createElement("button");
    b.type = "button"; b.className = "tm-item " + cls; b.setAttribute("role", "menuitem");
    b.innerHTML = html;
    b.addEventListener("click", onClick);
    menuEl.append(b);
    return b;
  }
  function renderMenu() {
    menuEl.textContent = "";
    teams.forEach((t) => {
      const cur = t.id === teamId;
      const nm = (cur ? teamName : store.get(K("team", t.id), "")).trim();
      const ppl = cur ? people : store.get(K("people", t.id), []);
      const b = menuButton(cur ? "on" : "", '<span class="tm-check">✓</span><span class="tm-name"></span><span class="tm-count"></span>', () => {
        closeMenu();
        if (!cur) loadTeam(t.id);
      });
      b.setAttribute("role", "menuitemradio"); b.setAttribute("aria-checked", String(cur));
      const nEl = b.querySelector(".tm-name");
      nEl.textContent = nm || "Без названия"; nEl.classList.toggle("untitled", !nm);
      b.querySelector(".tm-count").textContent = Array.isArray(ppl) && ppl.length ? plural(ppl.length) : "";
    });
    const sep = document.createElement("div"); sep.className = "tm-sep"; menuEl.append(sep);
    menuButton("", '<span class="tm-check" style="visibility:visible">＋</span><span class="tm-name">Новая команда</span><span></span>', () => {
      const id = "t" + Date.now().toString(36);
      teams.push({ id }); store.set("wheel.teams", teams);
      closeMenu(); loadTeam(id);
      teamEl.focus();
    });
    if (teams.length > 1) {
      const label = (teamName.trim() || "без названия");
      const del = menuButton("danger", '<span></span><span class="tm-name"></span><span></span>', () => {
        if (!deleteArmed) { deleteArmed = true; del.querySelector(".tm-name").textContent = "Нажми ещё раз, чтобы удалить"; return; }
        ["team", "people", "history", "picture"].forEach((k) => { try { localStorage.removeItem(K(k)); } catch (e) {} });
        teams = teams.filter((t) => t.id !== teamId); store.set("wheel.teams", teams);
        closeMenu(); loadTeam(teams[0].id);
      });
      del.querySelector(".tm-name").textContent = `Удалить «${label}»`;
    }
  }
  function openMenu() {
    if (S.spinning || M.open) return;
    deleteArmed = false; renderMenu();
    menuEl.hidden = false; teamsBtn.setAttribute("aria-expanded", "true");
    const first = menuEl.querySelector(".tm-item"); if (first) first.focus({ preventScroll: true });
  }
  function closeMenu() { menuEl.hidden = true; teamsBtn.setAttribute("aria-expanded", "false"); }
  teamsBtn.addEventListener("click", (e) => { e.stopPropagation(); menuEl.hidden ? openMenu() : closeMenu(); });
  document.addEventListener("click", (e) => { if (!menuEl.hidden && !menuEl.contains(e.target)) closeMenu(); });
  document.addEventListener("keydown", (e) => { if (e.key === "Escape" && !menuEl.hidden) { closeMenu(); teamsBtn.focus(); } });
  syncTitleWidth();

  syncVis(true);
  syncTitle();
  refreshBadges();
  renderChips();
  renderHistory();
  syncCoach();
  leverEl.classList.toggle("disabled", names.length < 2);
  resize();
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { buildFace(); refreshBadges(); });

  // ---------- Demo director ----------
  // Every event a person makes is dropped: the demo cannot be used as a wheel.
  ["keydown", "keyup", "keypress", "beforeinput", "paste", "cut", "copy", "pointerdown", "pointerup", "mousedown",
   "mouseup", "click", "dblclick", "contextmenu", "touchstart", "touchend", "dragstart", "dragover", "drop", "focusin"]
    .forEach((type) => window.addEventListener(type, (e) => {
      if (!e.isTrusted) return;
      e.stopImmediatePropagation(); e.preventDefault();
      if (type === "focusin" && e.target.blur) e.target.blur();
    }, true));
  document.querySelectorAll("input, button, svg[tabindex]").forEach((el) => {
    el.tabIndex = -1;
    if (el.tagName === "INPUT") el.readOnly = true;
  });

  const TEAM = "Core team", NAMES = "Sergey, Ruslan, Dima, Angelina, Alexey, Maxim, Denis, Egor";
  const wait = (ms) => new Promise((r) => setTimeout(r, ms));
  const tell = (step) => { try { parent.postMessage({ fortuneDeskDemo: step }, "*"); } catch (e) {} };
  const cursor = document.createElement("div");
  cursor.className = "demo-cursor";
  cursor.innerHTML = '<svg viewBox="0 0 24 24" width="26" height="26"><path d="M5 2.5v17.2l4.3-4.1 2.8 6.4 3-1.3-2.8-6.3 6-.4z" fill="#0E1A3A" stroke="#fff" stroke-width="1.6" stroke-linejoin="round"/></svg>';
  document.body.append(cursor);
  let cur = { x: 0, y: 0 };
  const place = (x, y) => { cur = { x, y }; cursor.style.transform = `translate(${x}px, ${y}px)`; };
  const centre = (el, fx = 0.5, fy = 0.5) => { const r = el.getBoundingClientRect(); return { x: r.left + r.width * fx, y: r.top + r.height * fy }; };
  function glide(to, ms = 700) {
    const from = { ...cur }, t0 = performance.now();
    return new Promise((done) => {
      (function go(now) {
        const p = Math.min(1, (now - t0) / ms), e = p < 0.5 ? 2 * p * p : 1 - Math.pow(-2 * p + 2, 2) / 2;
        place(from.x + (to.x - from.x) * e, from.y + (to.y - from.y) * e);
        if (p < 1) requestAnimationFrame(go); else done();
      })(t0);
    });
  }
  async function tap() { cursor.classList.add("down"); await wait(140); cursor.classList.remove("down"); }
  async function type(el, text, ms) {
    for (const ch of text) { el.value += ch; el.dispatchEvent(new Event("input")); await wait(ms + Math.random() * ms * 0.5); }
  }
  const teamInput = $("#team"), addInput = $("#add-name"), addBtn = $("#add .btn");

  function reset() {
    closeModal(); M.s = 0; M.v = 0; winEl.hidden = true;
    people = []; history = []; teamName = ""; onboarded = false; pulled = false;
    teamInput.value = ""; addInput.value = "";
    S.theta = Math.random() * TAU; S.omega = 0; S.spinning = false;
    syncTitle(); syncTitleWidth(); saveRoster(); renderHistory(); syncVis(true);
  }

  async function pullLever() {
    const k0 = centre(knobEl);
    await glide(k0, 800);
    cursor.classList.add("down");
    L.held = true; L.auto = false; L.peakV = 0; L.target = 0;
    leverEl.classList.add("held");
    const t0 = performance.now();
    await new Promise((done) => {
      (function go(now) {
        const p = Math.min(1, (now - t0) / 520);
        L.target = p * p;
        const k = centre(knobEl); place(k.x, k.y);
        if (p < 1) requestAnimationFrame(go); else done();
      })(t0);
    });
    await wait(120);
    // The hand lets go where it is; the lever springs back up without it.
    release();
    cursor.classList.remove("down");
    await wait(350);
    await glide({ x: cur.x + 60, y: cur.y + 30 }, 700);
  }

  async function play() {
    for (;;) {
      // Between rounds the cursor fades out and comes back at rest, instead of jumping there.
      cursor.classList.add("away");
      await wait(300);
      reset();
      tell(1);
      const rest = centre(document.querySelector(".stage"), 0.55, 0.45);
      place(rest.x, rest.y);
      await wait(100);
      cursor.classList.remove("away");
      await wait(1100);
      await glide(centre(teamInput, 0.15, 0.55));
      await tap();
      teamInput.classList.add("demo-focus");
      await wait(300);
      await type(teamInput, TEAM, 95);
      await wait(700);
      teamInput.classList.remove("demo-focus");

      tell(2);
      await glide(centre(addInput, 0.3, 0.55));
      await tap();
      addInput.classList.add("demo-focus");
      await wait(250);
      await type(addInput, NAMES, 45);
      await wait(400);
      await glide(centre(addBtn));
      await tap();
      addNames(addInput.value); addInput.value = "";
      addInput.classList.remove("demo-focus");
      await wait(1200);

      tell(3);
      await pullLever();
      while (!M.open) await wait(100);
      tell(4);
      await wait(3600);
    }
  }
  document.fonts && document.fonts.ready ? document.fonts.ready.then(() => setTimeout(play, 300)) : setTimeout(play, 600);
  requestAnimationFrame(frame);
})();
</script>

</body></html>
